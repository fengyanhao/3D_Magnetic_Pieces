<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动亲子磁力片网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(249, 115, 22, 0.15);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.25);
    }
    .logo svg { width: 40px; height: 40px; color: white; }
    h1 { margin: 0 0 12px; font-size: 24px; color: #1f2937; }
    p { margin: 0 0 32px; color: #6b7280; line-height: 1.6; font-size: 14px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(249, 115, 22, 0.35); }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      font-size: 13px;
      text-align: left;
    }
    .status.info { background: #eff6ff; color: #1d4ed8; border-left: 4px solid #3b82f6; }
    .status.success { background: #f0fdf4; color: #15803d; border-left: 4px solid #22c55e; }
    .status.warning { background: #fffbeb; color: #92400e; border-left: 4px solid #f59e0b; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check-icon {
      width: 24px; height: 24px; fill: #22c55e;
      display: inline-block; vertical-align: middle; margin-right: 8px;
    }
    .launcher-hint {
      margin-top: 24px; padding: 20px;
      background: #eff6ff; border-radius: 12px; text-align: left;
    }
    .launcher-hint h3 { margin: 0 0 8px; font-size: 14px; color: #1d4ed8; }
    .launcher-hint p { margin: 0; font-size: 13px; color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        <path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 18v4"/><path d="M17 22h4"/>
      </svg>
    </div>
    <h1>亲子磁力片</h1>
    <p>点击下方按钮启动本地网站服务，并自动在浏览器中打开最新版本。</p>

    <button id="startBtn" class="btn btn-primary" onclick="startSite()">
      <span id="btnText">启动并打开网站</span>
    </button>

    <button class="btn btn-secondary" onclick="checkServerOnly()">检查服务状态</button>

    <div id="status" class="status"></div>

    <div class="launcher-hint">
      <h3>🚀 首次使用指引</h3>
      <p>如果点击按钮后没有反应，请先双击项目目录下的 <code>启动器.bat</code> 文件，然后再点击本页面的启动按钮。</p>
    </div>
  </div>

  <script>
    const DEV_URL = 'http://localhost:5174';
    const LAUNCHER_URL = 'http://localhost:5175';

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = 'status ' + type;
    }

    function setLoading(loading) {
      const btn = document.getElementById('startBtn');
      const txt = document.getElementById('btnText');
      btn.disabled = loading;
      txt.innerHTML = loading ? '<span class="spinner"></span> 正在启动服务...' : '启动并打开网站';
    }

    async function fetchWithTimeout(url, opts = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), opts.timeout || 2000);
      opts.signal = controller.signal;
      try {
        const res = await fetch(url, opts);
        clearTimeout(timeout);
        return res;
      } catch {
        clearTimeout(timeout);
        throw new Error('请求超时');
      }
    }

    async function checkDevServer() {
      try {
        await fetchWithTimeout(DEV_URL, { method: 'HEAD' });
        return true;
      } catch { return false; }
    }

    async function checkLauncher() {
      try {
        const res = await fetchWithTimeout(LAUNCHER_URL + '/status');
        const data = await res.json();
        return data.running !== undefined;
      } catch { return false; }
    }

    async function checkServerOnly() {
      setStatus('正在检查服务状态...', 'info');
      const isRunning = await checkDevServer();
      if (isRunning) {
        setStatus('<svg class="check-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>服务已在运行！<a href="' + DEV_URL + '/" target="_blank" style="color:#2563eb">点击打开网站</a>', 'success');
      } else {
        const launcherReady = await checkLauncher();
        if (launcherReady) {
          setStatus('启动器已就绪，点击上方按钮即可启动网站。', 'info');
        } else {
          setStatus('服务未运行。请先双击项目目录下的 <code>启动器.bat</code> 文件启动启动器。', 'warning');
        }
      }
    }

    async function startSite() {
      setLoading(true);
      setStatus('正在检查本地服务是否运行...', 'info');

      const isRunning = await checkDevServer();
      if (isRunning) {
        setStatus('服务已在运行，正在打开网站...', 'success');
        window.location.href = DEV_URL;
        return;
      }

      const launcherReady = await checkLauncher();
      if (!launcherReady) {
        setStatus('启动器未运行，请先双击项目目录下的 <code>启动器.bat</code> 文件。', 'warning');
        setLoading(false);
        return;
      }

      setStatus('服务未运行，正在通过启动器启动...', 'info');

      try {
        const res = await fetchWithTimeout(LAUNCHER_URL + '/start', { method: 'POST', timeout: 5000 });
        const data = await res.json();

        if (data.success) {
          setStatus(data.message + '，正在等待服务就绪...', 'success');
          let attempts = 0;
          const maxAttempts = 30;
          const interval = setInterval(async () => {
            attempts++;
            const ready = await checkDevServer();
            if (ready) {
              clearInterval(interval);
              setStatus('服务启动成功！正在打开网站...', 'success');
              window.location.href = DEV_URL;
            } else if (attempts >= maxAttempts) {
              clearInterval(interval);
              setStatus('启动超时，请手动访问 ' + DEV_URL, 'warning');
              setLoading(false);
            } else {
              setStatus(`正在等待服务启动... (${attempts}/${maxAttempts})`, 'info');
            }
          }, 1000);
        } else {
          setStatus('启动失败：' + data.message, 'warning');
          setLoading(false);
        }
      } catch (e) {
        setStatus('启动请求失败：' + e.message, 'warning');
        setLoading(false);
      }
    }

    window.onload = checkServerOnly;
  </script>
</body>
</html>
