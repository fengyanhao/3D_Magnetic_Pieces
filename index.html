<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 在任何脚本/资源加载前，立即注销旧 Service Worker，避免其拦截 /editor 等新路由返回 404 -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        // 如果当前没有 SW 控制，直接触发注销残留 SW（若有）后放行
        if (!navigator.serviceWorker.controller) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            });
          }
          return;
        }
        // 有 SW 控制当前页面：注销 + 清缓存，然后刷新一次让请求绕过 SW
        // 用 sessionStorage 防止无限刷新循环
        var flag = sessionStorage.getItem('__sw_cleared__');
        if (flag) {
          // 已经刷新过一次但 SW 仍在控制，强制注销后放行（下次请求即生效）
          sessionStorage.removeItem('__sw_cleared__');
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          return;
        }
        sessionStorage.setItem('__sw_cleared__', '1');
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (n) { caches.delete(n); });
          });
        }
        location.reload();
      })();
    </script>
